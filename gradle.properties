# Match the shared Eignex Gradle defaults; setup-gradle persists reusable state between CI runs.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=4

# Compiling the coordinator and its test fixtures exceeds the inherited default compiler heap.
kotlin.daemon.jvmargs=-Xmx2g
