name: nomad-infrastructure
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: command -v sqlite3 || { sudo apt-get update -q && sudo apt-get install -y -q sqlite3; }
      - run: bash deploy/nomad/test_sandbox.sh && bash deploy/nomad/test_autoscaler.sh && bash deploy/nomad/test_prune_runtime.sh
      - run: bash deploy/nomad/test_native_services.sh
      - run: bash deploy/infra/tests/test_host_scripts.sh
      - run: bash deploy/infra/tests/test_input_store.sh
      - run: bash deploy/infra/tests/test_audit_inputs.sh
      - run: bash deploy/infra/validate.sh
