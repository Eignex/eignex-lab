name: release-bench

on:
  push:
    tags: ['lab-bench-v*']

permissions:
  contents: read

concurrency:
  group: release-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Read SDK version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#lab-bench-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+([.-][a-z0-9]+)*)?$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test the SDK and KBuild release assets
        env:
          BENCH_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew :lab-bench:check :lab-bench:verifyRelease -PbenchVersion="$BENCH_VERSION" --console=plain
      # KBuild stages the publications and checksums. Keep the SDK off the service's latest channel;
      # its upload task does not expose gh's --latest=false flag.
      - name: Publish public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=(--latest=false)
          if [[ "$BENCH_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" lab-bench/build/release-assets/* \
            --verify-tag --title "Lab Bench $BENCH_VERSION" --generate-notes "${flags[@]}"
