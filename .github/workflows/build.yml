name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # The lab's external checkers, so their tests run against the real tools (LAB_REQUIRE_CHECKERS fails them
      # rather than skipping when a tool cannot be had): GMP for building the MIPLIB solchecker.
      - run: sudo apt-get update -q && sudo apt-get install -y -q libgmp-dev zlib1g-dev zstd
      - run: ./gradlew check
        env:
          LAB_REQUIRE_CHECKERS: "1"
      - name: Preserve exact MPS checker test receipts
        if: always()
        run: |
          mkdir -p build/checker-test-results
          cp build/test-results/test/TEST-com.eignex.lab.checker.ExactMpsCheckerTest.xml build/checker-test-results/
          cp build/test-results/test/TEST-com.eignex.lab.checker.MpsReplayTest.xml build/checker-test-results/
      - name: Verify representative warm preparation work
        run: ./gradlew :verifyPreparationPerformance
        env:
          LAB_PREPARATION_PERF_ROOT: ${{ runner.temp }}/prepperf
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preparation-performance-linux
          path: ${{ runner.temp }}/prepperf/preparation-performance.json
          if-no-files-found: ignore
      - name: Verify bench SDK release assets
        run: ./gradlew :lab-bench:verifyRelease
      - name: Validate service installation
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - name: Validate native service configuration
        run: python3 -m unittest discover -s deploy/nomad -p 'test_*.py'
      - name: Build experimental Nomad session renderer
        run: ./gradlew installDist
      - name: Install pinned Nomad prototype
        run: python3 deploy/nomad/sandbox.py install
      - name: Start isolated Nomad prototype
        run: python3 deploy/nomad/sandbox.py start
      - name: Verify shared sessions and hard resource limits
        run: python3 deploy/nomad/sandbox.py verify
      - name: Stop Nomad prototype
        if: always()
        run: python3 deploy/nomad/sandbox.py stop
      - name: Verify connected worker, coordinator restart and allocation loss
        run: python3 deploy/nomad/connected_probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nomad-prototype-verification
          path: build/nomad-prototype/verification.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            build/test-results/
            build/checker-test-results/
            build/reports/tests/
            lab-bench/build/test-results/
            lab-bench/build/reports/tests/
      - run: ./gradlew distZip
      - uses: actions/upload-artifact@v7
        with:
          name: eignex-lab-distribution
          path: build/distributions/*.zip

  native-worker:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Validate service installation
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - name: Verify native worker, detached process cleanup and durable ownership
        run: ./gradlew :test --tests com.eignex.lab.PortableWorkerTest --tests com.eignex.lab.ExecutionStoreTest --tests com.eignex.lab.ExecutionMigrationTest --tests com.eignex.lab.NomadBatchJobTest --tests com.eignex.lab.NomadBackendTest --tests com.eignex.lab.ProfileRunDeadlineTest --tests com.eignex.lab.NomadQueueTest --tests com.eignex.lab.QueueEfficiencyTest --tests com.eignex.lab.CapacityPolicyTest --tests com.eignex.lab.SharedInputCacheTest --tests com.eignex.lab.SharedInputsTest --tests com.eignex.lab.WorkerFailureTest --tests com.eignex.lab.TreeVerificationTest --tests com.eignex.lab.WorkerTreesTest --tests com.eignex.lab.ColdStagingTest --tests com.eignex.lab.WorkerBuildStagingTest --tests com.eignex.lab.WorkerBuildAccountingTest --tests com.eignex.lab.PreparationTraceTest --tests com.eignex.lab.WorkerWorkspacesTest --tests com.eignex.lab.ResultJournalTest --tests com.eignex.lab.PackedJournalTest --tests com.eignex.lab.WorkerRetryTest --tests com.eignex.lab.WorkerTransferTest --tests com.eignex.lab.ArtifactReuseTest --tests com.eignex.lab.WorkerArchiveCacheTest
      - name: Verify representative native warm preparation work
        run: ./gradlew :verifyPreparationPerformance
        env:
          LAB_PREPARATION_PERF_ROOT: ${{ runner.temp }}/prepperf
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preparation-performance-native
          path: ${{ runner.temp }}/prepperf/preparation-performance.json
          if-no-files-found: ignore
      - name: Package tested controller
        run: ./gradlew distZip
      - uses: actions/upload-artifact@v7
        with:
          name: eignex-lab-native-distribution
          path: build/distributions/*.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-worker-tests
          path: build/test-results/
