name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: build/test-results/
      - run: ./gradlew distZip
      - uses: actions/upload-artifact@v7
        with:
          name: klause-lab-distribution
          path: build/distributions/*.zip

  xcsp3-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test XCSP3 reference importer
        run: |
          docker build -t klause-xcsp3-cpsat:source-preserving-v2 images/xcsp3-cpsat
          docker run --rm --entrypoint python -v "$PWD/images/xcsp3-cpsat:/tests:ro" -w /tests klause-xcsp3-cpsat:source-preserving-v2 test_solve.py
