name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # The lab's external checkers, so their tests run against the real tools (LAB_REQUIRE_CHECKERS fails them
      # rather than skipping when a tool cannot be had): GMP for building the MIPLIB solchecker.
      - run: sudo apt-get update -q && sudo apt-get install -y -q libgmp-dev zlib1g-dev zstd libegl1 libgl1
      # MiniZinc with Gecode, the bundle a cloud node installs.
      - run: |
          sudo mkdir -p /opt/minizinc
          curl -fsSL https://github.com/MiniZinc/MiniZincIDE/releases/download/2.9.7/MiniZincIDE-2.9.7-bundle-linux-x86_64.tgz |
            sudo tar -xz -C /opt/minizinc --strip-components=1
          echo /opt/minizinc/bin >> "$GITHUB_PATH"
      # Z3, the checker for algebraic SMT-LIB models Dolmen cannot read: the release build, checked against its SHA-256.
      - run: |
          curl -fsSL -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
          echo "7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e  /tmp/z3.zip" | sha256sum -c -
          sudo unzip -q /tmp/z3.zip -d /opt
          echo /opt/z3-4.16.0-x64-glibc-2.39/bin >> "$GITHUB_PATH"
      - run: ./gradlew check
        env:
          LAB_REQUIRE_CHECKERS: "1"
      - name: Build experimental Nomad session renderer
        run: ./gradlew installDist
      - name: Install pinned Nomad prototype
        run: python3 deploy/nomad/sandbox.py install
      - name: Start isolated Nomad prototype
        run: python3 deploy/nomad/sandbox.py start
      - name: Verify shared sessions and hard resource limits
        run: python3 deploy/nomad/sandbox.py verify
      - name: Stop Nomad prototype
        if: always()
        run: python3 deploy/nomad/sandbox.py stop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nomad-prototype-verification
          path: build/nomad-prototype/verification.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            build/test-results/
            build/reports/tests/
      - run: ./gradlew distZip
      - uses: actions/upload-artifact@v7
        with:
          name: eignex-lab-distribution
          path: build/distributions/*.zip

  native-worker:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify native worker, detached process cleanup and durable ownership
        run: ./gradlew test --tests com.eignex.lab.PortableWorkerTest --tests com.eignex.lab.ExecutionStoreTest --tests com.eignex.lab.NomadBatchJobTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-worker-tests
          path: build/test-results/
