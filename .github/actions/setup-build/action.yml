name: Set up build
description: Install the shared Eignex JDK and cached Gradle environment

inputs:
  cache-encryption-key:
    description: Key used by setup-gradle to persist encrypted configuration-cache entries
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
    - name: Cache encrypted configuration state
      if: inputs.cache-encryption-key != ''
      uses: actions/cache@v6
      with:
        path: .gradle/configuration-cache
        key: ${{ runner.os }}-${{ runner.arch }}-configuration-${{ github.job }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-configuration-${{ github.job }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}-
