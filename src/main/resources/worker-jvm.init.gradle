// Ordinary JVM preparation avoids native release configuration, which unsupported
// compiler hosts (for example Linux ARM64) cannot provide. An explicitly requested
// native CLI task needs that configuration: the CLI plugin registers its executable
// binaries only while release assets are enabled.
def nativeCliRequested = gradle.startParameter.taskNames.any { path ->
    def name = path.tokenize(':').last()
    name == 'releaseAssets' || name ==~ /link(Debug|Release)Executable[A-Z].*/
}
gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.eignex.cli') {
        if (!nativeCliRequested) project.extensions.getByName('eignexCli').releaseAssetsEnabled.set(false)
    }
}

// Preparation only builds runtime artifacts. Exclude test tasks before Gradle
// resolves the graph so their test compilation and fixture dependencies are
// omitted too; enabled=false would still build those dependencies.
gradle.projectsEvaluated {
    def tests = gradle.rootProject.allprojects.collectMany { project ->
        project.tasks.withType(org.gradle.api.tasks.testing.AbstractTestTask).collect { it.path }
    }
    gradle.startParameter.excludedTaskNames += tests
}
